.k0{animation:up .7s ease-out 0.0s both}.p0{animation:pu 4s ease-in-out 1.0s infinite}
.k1{animation:up .7s ease-out 0.18s both}.p1{animation:pu 4s ease-in-out 1.18s infinite}
